plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

repositories {
    mavenCentral()
}

// Development-only check of the client's placement prediction (loglayertest); never included in the mod jar.
sourceSets {
    clienttest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

neoForge {
    version = project.neo_version

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
        loglayertest {
            sourceSet sourceSets.clienttest
        }
    }

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        // A real client: makes a flat world, places logs, compares the client's prediction with the server, quits.
        clientCheck {
            client()
            gameDirectory = project.file('run-clientcheck')
            sourceSet = sourceSets.clienttest
            loadedMods = [neoForge.mods.named(mod_id).get(), neoForge.mods.named('loglayertest').get()]
            programArguments.addAll '--width', '854', '--height', '480'
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

}

neoForge.addModdingDependenciesTo(sourceSets.clienttest)

tasks.named('runClientCheck').configure {
    doFirst {
        delete file('run-clientcheck/loglayer-check.txt')
        delete file('run-clientcheck/saves/loglayercheck')
    }
    doLast {
        def report = file('run-clientcheck/loglayer-check.txt')
        if (!report.exists()) throw new GradleException('clientCheck produced no result')
        logger.lifecycle(report.text)
        if (!report.text.startsWith('PASS ')) throw new GradleException('clientCheck failed')
    }
}

dependencies {
}

// Expand mod metadata template (src/main/templates) into generated resources.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
